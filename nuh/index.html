<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prophet Nuh Quiz</title>
<style>
  :root{--green:#1f7a5c;--gold:#c9962b;--cream:#fff9ec;--ink:#2b2b2b;--red:#d64545;--sky:#e8f4f1}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:var(--sky);color:var(--ink);line-height:1.4}
  .wrap{max-width:640px;margin:0 auto;padding:18px}
  h1{color:var(--green);text-align:center;font-size:1.7rem;margin:8px 0 4px}
  .sub{text-align:center;margin:0 0 18px;color:#555}
  .card{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);border:3px solid transparent}
  .card.wrong{border-color:var(--red);animation:shake .4s}
  .card h3{margin:0 0 10px;font-size:1.1rem}
  .opt{display:block;padding:12px 14px;margin:8px 0;border:2px solid #cfe3dd;border-radius:12px;cursor:pointer;font-size:1.05rem;background:#fafffd}
  .opt:hover{border-color:var(--green)}
  .opt input{margin-right:10px;transform:scale(1.3)}
  .opt.sel{background:#e3f6ee;border-color:var(--green)}
  label.name{display:block;font-weight:bold;margin-bottom:6px}
  input[type=text]{width:100%;padding:12px;font-size:1.1rem;border:2px solid #cfe3dd;border-radius:12px}
  button{font-size:1.15rem;padding:14px 22px;border:0;border-radius:14px;background:var(--green);color:#fff;cursor:pointer;font-weight:bold;width:100%}
  button.gold{background:var(--gold)}
  button:active{transform:scale(.98)}
  .msg{text-align:center;font-size:1.15rem;margin:12px 0;font-weight:bold;min-height:1.5em}
  .msg.bad{color:var(--red)}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .hidden{display:none!important}

  /* Certificate */
  #certWrap{padding:10px}
  .cert{position:relative;background:var(--cream);border:14px double var(--gold);padding:28px 24px;text-align:center;aspect-ratio:1.414/1;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
  .cert:before{content:"";position:absolute;inset:8px;border:2px solid var(--green);pointer-events:none}
  .cert .star{font-size:2.2rem;color:var(--gold);line-height:1}
  .cert .bism{font-size:1.1rem;color:var(--green);margin:2px 0 6px;font-family:"Traditional Arabic","Amiri","Times New Roman",serif}
  .cert h2{margin:4px 0;font-size:2rem;color:var(--green);font-family:Georgia,serif;letter-spacing:1px}
  .cert .small{font-size:1rem;margin:4px 0;color:#555}
  .cert .who{font-size:2.2rem;color:var(--gold);font-family:Georgia,"Brush Script MT",cursive;margin:8px 0;border-bottom:2px solid var(--gold);padding:0 24px 4px;min-width:50%;word-break:break-word}
  .cert .what{font-size:1.1rem;margin:6px 0;max-width:90%}
  .cert .foot{margin-top:12px;font-size:1rem;color:#555}
  .cert .dua{font-style:italic;color:var(--green);margin-top:6px}
  @media (max-width:560px){.cert h2{font-size:1.4rem}.cert .who{font-size:1.5rem}.cert .what{font-size:.95rem}.cert{padding:22px 12px;border-width:10px;aspect-ratio:auto;overflow:visible}}

  @media print{
    @page{size:A4 landscape;margin:0}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .noprint,h1,.sub,#quiz{display:none!important}
    #certWrap{padding:0}
    .cert{width:100vw;height:100vh;aspect-ratio:auto;border-width:18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .cert h2{font-size:3rem}.cert .who{font-size:3.4rem}.cert .what{font-size:1.6rem}.cert .small,.cert .foot{font-size:1.3rem}.cert .bism{font-size:1.8rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <div id="quiz">
    <div class="card">
      <label class="name" for="kidName">What is your name?</label>
      <input type="text" id="kidName" maxlength="40" placeholder="Type your name here" autocomplete="off">
    </div>
    <div id="questions"></div>
    <div class="msg" id="msg"></div>
    <button id="checkBtn">Check my answers ✔</button>
  </div>

  <div id="certWrap" class="hidden">
    <div class="msg noprint" style="color:var(--green)">🌟 Mashaa Allah! All answers are correct! 🌟</div>
    <div class="cert" id="cert">
      <div class="star">✦ ✦ ✦</div>
      <div class="bism">بسم الله الرحمن الرحيم</div>
      <h2>Certificate of Appreciation</h2>
      <div class="small">is proudly presented to</div>
      <div class="who" id="certName"></div>
      <div class="what" id="certWhat"></div>
      <div class="dua">May Allah bless you and make you love learning!</div>
      <div class="foot">Date: <span id="certDate"></span></div>
    </div>
    <div class="noprint" style="margin-top:14px;display:grid;gap:10px">
      <button class="gold" id="printBtn">🖨️ Print my certificate</button>
      <button id="againBtn" style="background:#6b8f86">Play again</button>
    </div>
  </div>
</div>

<script>
/* ===== Edit only this block for each new prophet ===== */
const CONFIG = {
  title: "Prophet Nuh (Noah) Quiz",
  subtitle: "Answer all 5 questions to get your certificate!",
  certificateText: "for completing the story of Prophet Nuh (Noah), peace be upon him, and answering all the questions correctly.",
  questions: [
    {q:"Who chose Nuh to be a Prophet?", options:["The king","Allah","The people"], answer:1},
    {q:"What did Prophet Nuh ask his people to do?", options:["Worship only Allah","Build a castle","Go on a trip"], answer:0},
    {q:"What did Allah tell Nuh to build?", options:["A big house","A tall tower","A big ark (ship)"], answer:2},
    {q:"What did Nuh take on the ark with the believers?", options:["Two of every kind of animal","Only birds","Toys"], answer:0},
    {q:"What can we learn from Nuh?", options:["Give up quickly","Be patient and trust Allah","Laugh at others"], answer:1}
  ]
};
/* ===================================================== */

const $ = id => document.getElementById(id);
$("title").textContent = CONFIG.title;
$("sub").textContent = CONFIG.subtitle;
$("certWhat").textContent = CONFIG.certificateText;

function build(){
  const box = $("questions"); box.innerHTML = "";
  CONFIG.questions.forEach((item, i) => {
    const card = document.createElement("div"); card.className = "card"; card.id = "card"+i;
    const h = document.createElement("h3"); h.textContent = (i+1)+". "+item.q; card.appendChild(h);
    item.options.forEach((text, j) => {
      const lab = document.createElement("label"); lab.className = "opt";
      const inp = document.createElement("input"); inp.type = "radio"; inp.name = "q"+i; inp.value = j;
      inp.addEventListener("change", () => {
        card.querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
        lab.classList.add("sel"); card.classList.remove("wrong");
      });
      lab.appendChild(inp); lab.appendChild(document.createTextNode(text)); card.appendChild(lab);
    });
    box.appendChild(card);
  });
}
build();

$("checkBtn").addEventListener("click", () => {
  const msg = $("msg"); msg.className = "msg";
  const name = $("kidName").value.trim();
  if(!name){ msg.textContent = "Please type your name first 😊"; msg.classList.add("bad"); $("kidName").focus(); return; }

  let unanswered = 0, wrong = [];
  CONFIG.questions.forEach((item, i) => {
    const picked = document.querySelector('input[name="q'+i+'"]:checked');
    if(!picked){ unanswered++; return; }
    if(Number(picked.value) !== item.answer) wrong.push(i);
  });
  document.querySelectorAll(".card.wrong").forEach(c => c.classList.remove("wrong"));

  if(unanswered){ msg.textContent = "Please answer all the questions 😊"; msg.classList.add("bad"); return; }

  if(wrong.length){
    wrong.forEach(i => {
      const card = $("card"+i); card.classList.add("wrong");
      card.querySelectorAll("input").forEach(r => r.checked = false);
      card.querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
    });
    msg.textContent = "Almost there! Try the red questions again 💪";
    msg.classList.add("bad");
    $("card"+wrong[0]).scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }

  $("certName").textContent = name;
  $("certDate").textContent = new Date().toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"});
  $("quiz").classList.add("hidden"); $("certWrap").classList.remove("hidden");
  window.scrollTo(0,0);
});

$("printBtn").addEventListener("click", () => window.print());
$("againBtn").addEventListener("click", () => {
  $("certWrap").classList.add("hidden"); $("quiz").classList.remove("hidden");
  $("msg").textContent = ""; build(); window.scrollTo(0,0);
});
</script>
</body>
</html>
